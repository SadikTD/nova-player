# Nova Player — keybindings.
# Keys reach mpv via IPC forwarding from the overlay window (the video surface
# itself never has keyboard focus). Mouse input is handled by the overlay UI.

SPACE            cycle pause
ENTER            cycle fullscreen
f                cycle fullscreen
RIGHT            seek 10
LEFT             seek -10
UP               add volume 5
DOWN             add volume -5
Shift+RIGHT      seek 60
Shift+LEFT       seek -60
.                frame-step
,                frame-back-step

# Speed
]                add speed 0.1
[                add speed -0.1
BS               set speed 1.0

# A-B repeat
l                ab-loop

# Subtitles
v                cycle sub-visibility
j                cycle sub
z                add sub-delay -0.1
x                add sub-delay +0.1
Ctrl+UP          add sub-pos -1
Ctrl+DOWN        add sub-pos +1
Alt+UP           add sub-scale +0.05
Alt+DOWN         add sub-scale -0.05

# Audio
SHARP            cycle audio
+                add audio-delay 0.100
-                add audio-delay -0.100
m                cycle mute

# Video adjustments
1                add contrast -1
2                add contrast 1
3                add brightness -1
4                add brightness 1
5                add gamma -1
6                add gamma 1
7                add saturation -1
8                add saturation 1
0                set contrast 0; set brightness 0; set gamma 0; set saturation 0

# Zoom / aspect / rotate
a                cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
r                cycle-values video-rotate 90 180 270 0

# Screenshot
s                screenshot
Shift+S          screenshot video

# Playlist
>                playlist-next
<                playlist-prev

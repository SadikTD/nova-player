# Nova Player — playback engine configuration

# All UI lives in Nova's overlay window; disable mpv's own
osc=no
osd-bar=no
border=no
window-dragging=no

# Quality & performance
profile=high-quality
hwdec=auto-safe
vo=gpu-next
# video-sync=audio is mpv's default and by far the most robust. display-resync
# continuously retimes audio against the monitor's refresh rate; at non-1x speed
# that feedback loop can wedge the decode threads, which showed up as playback
# freezing solid after a long stretch of fast playback.
video-sync=audio
interpolation=no
deband=yes

# Audio
volume=100
volume-max=200
audio-file-auto=fuzzy
audio-pitch-correction=yes

# Subtitles — MX-style: find and show them automatically
sub-auto=fuzzy
sub-file-paths=subs;subtitles;Subs;Subtitles
sub-font='Segoe UI Semibold'
sub-font-size=44
sub-border-size=2.4
sub-color='#FFFFFF'
sub-border-color='#101010'
sub-shadow-offset=1
sub-fix-timing=yes
slang=en,eng

# Behavior
keep-open=yes
# Resume is owned by Nova (see MpvController._storedResume): our store is written
# every few seconds, mpv's watch-later file only after a clean quit. Two sources
# of truth meant a stale one could win and restart a video from the beginning.
no-resume-playback
save-position-on-quit=no
autofit-larger=85%x85%
snap-window=yes
prefetch-playlist=yes
force-seekable=yes

# Screenshots go to Pictures
screenshot-format=png
screenshot-directory=~~desktop/
screenshot-template='NovaPlayer-%F-%P'

# OSD styling (used for gesture feedback)
osd-font='Segoe UI Semibold'
osd-font-size=34
osd-color='#FFFFFF'
osd-border-size=1.6
osd-border-color='#0D1017'
osd-duration=800

# Nova Player — playback engine configuration

# UI is provided by uosc; disable the stock ones
osc=no
osd-bar=no
border=no
window-dragging=no

# Quality & performance
profile=high-quality
hwdec=auto-safe
vo=gpu-next
video-sync=display-resync
interpolation=no
deband=yes

# Audio
volume=100
volume-max=200
audio-file-auto=fuzzy
audio-pitch-correction=yes

# Subtitles — MX-style: find and show them automatically
sub-auto=fuzzy
sub-file-paths=subs;subtitles;Subs;Subtitles
sub-font='Segoe UI Semibold'
sub-font-size=44
sub-border-size=2.4
sub-color='#FFFFFF'
sub-border-color='#101010'
sub-shadow-offset=1
sub-fix-timing=yes
slang=en,eng

# Behavior
keep-open=yes
save-position-on-quit
watch-later-options=start,volume,speed,sub-visibility,aid,sid
autofit-larger=85%x85%
snap-window=yes
prefetch-playlist=yes
force-seekable=yes

# Screenshots go to Pictures
screenshot-format=png
screenshot-directory=~~desktop/
screenshot-template='NovaPlayer-%F-%P'

# OSD styling (used for gesture feedback)
osd-font='Segoe UI Semibold'
osd-font-size=34
osd-color='#FFFFFF'
osd-border-size=1.6
osd-border-color='#0D1017'
osd-duration=800

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
  <title>Nova Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="titlebar">
    <div class="tb-left">
      <div class="tb-logo"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5.5 L18 12 L8 18.5 Z" fill="currentColor"/></svg></div>
      <span class="tb-title">Nova Player</span>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-min" title="Minimize"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg></button>
      <button class="tb-btn" id="btn-max" title="Maximize"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button class="tb-btn tb-close" id="btn-close" title="Close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <div id="shell">
    <nav id="sidebar">
      <button class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z"/></svg><span>Home</span>
      </button>
      <button class="nav-item" data-view="folders">
        <svg viewBox="0 0 24 24"><path d="M3 6 H9 L11 8 H21 V19 H3 Z"/></svg><span>Folders</span>
      </button>
      <button class="nav-item" data-view="playlists">
        <svg viewBox="0 0 24 24"><path d="M4 6 H16 M4 10 H16 M4 14 H10 M14 13 V19 L19 16 Z"/></svg><span>Playlists</span>
      </button>
      <button class="nav-item" data-view="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none"/><path d="M12 7 V12 L15.5 14"/></svg><span>History</span>
      </button>
      <div class="nav-spacer"></div>
      <button class="nav-item" data-view="network">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none"/><path d="M4 12 H20 M12 4 C8 8 8 16 12 20 C16 16 16 8 12 4"/></svg><span>Stream</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none"/><path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M19.1 4.9 L17 7 M7 17 L4.9 19.1"/></svg><span>Settings</span>
      </button>
    </nav>

    <main id="content">
      <header id="topbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15 L20 20" stroke="currentColor" stroke-width="2"/></svg>
          <input id="search" type="text" placeholder="Search your videos…" spellcheck="false">
        </div>
        <button class="btn ghost" id="btn-open-file">Open file</button>
        <button class="btn accent" id="btn-add-folder">+ Add folder</button>
      </header>
      <div id="views"></div>
    </main>
  </div>

  <button id="fab" class="hidden" title="Resume last video">
    <svg viewBox="0 0 24 24"><path d="M8 5.5 L19 12 L8 18.5 Z"/></svg>
  </button>

  <div id="dropzone"><div class="drop-inner"><div class="drop-icon">⤓</div><div>Drop to play</div></div></div>
  <div id="ctx-menu" class="hidden"></div>
  <div id="modal-root" class="hidden"></div>
  <div id="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>

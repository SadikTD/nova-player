<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Nova Player — controls</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="stage">

    <div id="top-bar" class="bar">
      <button class="pbtn" id="btn-back" title="Back to library (Esc)">
        <svg viewBox="0 0 24 24"><path d="M14 6 L8 12 L14 18"/></svg>
      </button>
      <div id="title-wrap">
        <div id="v-title">&nbsp;</div>
        <div id="v-sub">&nbsp;</div>
      </div>
      <button class="pbtn" id="btn-playlist" title="Playlist">
        <svg viewBox="0 0 24 24"><path d="M4 6 H15 M4 11 H15 M4 16 H9 M13 15 V21 L18 18 Z"/></svg>
        <span id="pl-count" class="pbtn-tag"></span>
      </button>
      <div class="win-btns">
        <button class="pbtn" id="btn-min"><svg viewBox="0 0 24 24"><path d="M6 12 H18"/></svg></button>
        <button class="pbtn" id="btn-max"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="none"/></svg></button>
        <button class="pbtn close" id="btn-close"><svg viewBox="0 0 24 24"><path d="M7 7 L17 17 M17 7 L7 17"/></svg></button>
      </div>
    </div>

    <div id="center">
      <div id="flash" class="hidden"></div>
      <div id="spinner" class="hidden"><div class="ring"></div><span>Buffering…</span></div>
      <div id="hud" class="hidden">
        <div id="hud-icon"></div>
        <div id="hud-bar"><div id="hud-fill"></div></div>
        <div id="hud-text"></div>
      </div>
      <div id="seek-hud" class="hidden"></div>
      <div id="end-screen" class="hidden">
        <div class="end-title">Playback finished</div>
        <div class="end-actions">
          <button class="end-btn accent" id="btn-replay">⟲ Replay</button>
          <button class="end-btn" id="btn-end-back">Back to library</button>
        </div>
      </div>
    </div>

    <div id="bottom-bar" class="bar">
      <div id="seek-row">
        <div id="seekbar">
          <div id="seek-track">
            <div id="chapter-marks"></div>
            <div id="seek-fill"></div>
            <div id="seek-thumb"></div>
          </div>
        </div>
        <div id="seek-tip" class="hidden">0:00</div>
      </div>
      <div id="controls-row">
        <button class="pbtn" id="btn-prev" title="Previous (<)">
          <svg viewBox="0 0 24 24"><path d="M17 6 L10 12 L17 18 Z" class="f"/><path d="M7 6 V18"/></svg>
        </button>
        <button class="pbtn big" id="btn-play" title="Play/Pause (Space)">
          <svg viewBox="0 0 24 24" id="ic-play"><path d="M8 5.5 L19 12 L8 18.5 Z" class="f"/></svg>
          <svg viewBox="0 0 24 24" id="ic-pause" class="hidden"><path d="M8 5.5 V18.5 M16 5.5 V18.5" stroke-width="3"/></svg>
        </button>
        <button class="pbtn" id="btn-next" title="Next (>)">
          <svg viewBox="0 0 24 24"><path d="M7 6 L14 12 L7 18 Z" class="f"/><path d="M17 6 V18"/></svg>
        </button>
        <button class="pbtn" id="btn-b10" title="Back 10s (←)">
          <svg viewBox="0 0 24 24"><path d="M11 5 A 7.5 7.5 0 1 0 19 12"/><path d="M11 2 L11 8 L16 5 Z" class="f" transform="rotate(-40 11 5)"/><text x="12" y="16" class="t">10</text></svg>
        </button>
        <button class="pbtn" id="btn-f10" title="Forward 10s (→)">
          <svg viewBox="0 0 24 24"><path d="M13 5 A 7.5 7.5 0 1 1 5 12"/><path d="M13 2 L13 8 L8 5 Z" class="f" transform="rotate(40 13 5)"/><text x="12" y="16" class="t">10</text></svg>
        </button>
        <div id="vol-wrap">
          <button class="pbtn" id="btn-mute" title="Mute (m)">
            <svg viewBox="0 0 24 24" id="ic-vol"><path d="M4 10 V14 H8 L13 18 V6 L8 10 Z" class="f"/><path id="vol-w1" d="M16 9.5 A 4 4 0 0 1 16 14.5"/><path id="vol-w2" d="M18.5 7 A 8 8 0 0 1 18.5 17"/></svg>
          </button>
          <input type="range" id="vol-slider" min="0" max="200" step="1" value="100">
          <span id="vol-label">100%</span>
        </div>
        <div id="time-label"><span id="t-cur">0:00</span><span class="t-sep">/</span><span id="t-dur">0:00</span></div>
        <div class="spacer"></div>
        <button class="pbtn tag-btn" id="btn-ab" title="A-B repeat (l)">A·B</button>
        <button class="pbtn tag-btn" id="btn-speed" title="Playback speed">1.0×</button>
        <button class="pbtn" id="btn-audio" title="Audio tracks">
          <svg viewBox="0 0 24 24"><path d="M4 14 V17 A 2 2 0 0 0 8 17 V14 M20 14 V17 A 2 2 0 0 1 16 17 V14"/><path d="M4 14 V11 A 8 8 0 0 1 20 11 V14"/></svg>
        </button>
        <button class="pbtn" id="btn-subs" title="Subtitles">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2" fill="none"/><path d="M6 12 H11 M13 12 H18 M6 15.5 H9 M11 15.5 H18"/></svg>
        </button>
        <button class="pbtn" id="btn-settings" title="Video settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none"/><path d="M12 3 V6 M12 18 V21 M3 12 H6 M18 12 H21 M5.6 5.6 L7.7 7.7 M16.3 16.3 L18.4 18.4 M18.4 5.6 L16.3 7.7 M7.7 16.3 L5.6 18.4"/></svg>
        </button>
        <button class="pbtn" id="btn-shot" title="Screenshot (s)">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2" fill="none"/><path d="M8 7 L10 4 H14 L16 7"/><circle cx="12" cy="13" r="3.5" fill="none"/></svg>
        </button>
        <button class="pbtn" id="btn-fs" title="Fullscreen (f / double-click)">
          <svg viewBox="0 0 24 24" id="ic-fs"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"/></svg>
          <svg viewBox="0 0 24 24" id="ic-unfs" class="hidden"><path d="M9 4 V9 H4 M20 9 H15 V4 M15 20 V15 H20 M4 15 H9 V20"/></svg>
        </button>
      </div>
    </div>

    <div id="popover" class="hidden"></div>
    <div id="ctx" class="hidden"></div>
    <div id="p-toast" class="hidden"></div>
  </div>
  <script src="player.js"></script>
</body>
</html>

# The APK is download-size sensitive: Play's budget is 200 MB compressed per
# device. Keep the build lean and let Gradle know we intend to ship native libs.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 16 KB page-size devices (Android 15+): native libs must be linked accordingly.
# mpv-android's buildall.sh already passes -Wl,-z,max-page-size=16384.
android.experimental.art.enablePageSizeAwareAlignment=true
